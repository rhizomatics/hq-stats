# Copy to .github/workflows/collect-stats.yml in the repo that holds your repos.toml.
# Snapshots once a day and commits them; rebuilds the public aggregate (stats.json) from them.
# To publish the pages too, add publish-stats.yml next to it.
#
# Secrets:
#   STATS_TOKEN        fine-grained token for your repos (an org's, or your own account's): "Metadata: read" and
#                      "Administration: read" (GitHub's traffic API needs the latter). Without traffic access, repo
#                      views and clones are recorded as errors and everything else still works.
#   GOATCOUNTER_TOKEN  optional: a GoatCounter API key with "Read statistics", for repos with `goatcounter`.
#
# Runs on a schedule and by hand only, never on pull requests: the token can read traffic for every repo.
name: Collect stats

on:
  schedule:
    # Off the top of the hour: GitHub queues scheduled runs, and :00 is the busiest slot.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: collect-stats

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        # Pin the version and update it deliberately (Dependabot doesn't see npx). If you also use the pages
        # (site/package.json), run `npx --no-install hq-stats` from site/ instead, so Dependabot updates one version.
        run: npx --yes @rhizomatics/hq-stats@0.2.1 collect
      - name: Aggregate
        run: npx --yes @rhizomatics/hq-stats@0.2.1 build
      - name: Commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "stats: $(date -u +%F)"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Snapshots are new dated files, so rebasing onto anything else pushed meanwhile never conflicts.
          for attempt in 1 2 3; do
            git push "$remote" "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
            git pull --rebase "$remote" "${GITHUB_REF_NAME}"
          done
          exit 1
